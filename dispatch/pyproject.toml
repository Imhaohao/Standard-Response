[project]
name = "dispatch"
version = "0.1.0"
description = "Track C: road graph, OR-Tools dispatch solver and the evacuation simulator"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.10",
  "osmnx>=2.0",
  "simpy>=4.1",
  "scipy>=1.11",
  "numpy>=1.26",
  "convex>=0.8.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
