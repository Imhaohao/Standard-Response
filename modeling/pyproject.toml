[project]
name = "rollcall-d"
version = "0.1.0"
description = "Hazard scenario, need model, door-check queue, address matching, population, personas and evaluation"
requires-python = ">=3.11"
dependencies = [
  "convex>=0.7",
  "osmnx>=2.0",
  "networkx>=3.2",
  "numpy>=1.26",
  "shapely>=2.0",
  "requests>=2.31",
  "rapidfuzz>=3.6",
  "anthropic>=0.40",
  "scikit-fmm>=2024.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
