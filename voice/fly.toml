# Deploy from the repo root: npm run deploy:voice
app = "rollcall-voice"
primary_region = "sjc"

[http_service]
  internal_port = 8080
  force_https = true
  # Calls, the dialer and callbacks need the server up all night.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  memory = "512mb"
  cpus = 1
